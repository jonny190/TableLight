; TableLight - WLED build environment
; Copy this file into the root of a WLED source checkout (next to platformio.ini) and run:
;     pio run -e tablelight            (build)
;     pio run -e tablelight -t upload  (flash over the lamp's USB-C / CH340C)
;
; Stock WLED "esp32dev" binaries also work (without the battery percentage); these flags only
; add the Battery usermod and bake in this board's pin defaults so a fresh flash needs no clicking.

[env:tablelight]
extends = env:esp32dev
board = esp32dev
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_RELEASE_NAME=TableLight
  ; ---- LED output: GPIO2 through the 74AHCT1G125 level shifter ----
  -D DATA_PINS=2
  -D DEFAULT_LED_COUNT=24
  -D DEFAULT_LED_TYPE=TYPE_SK6812_RGBW
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_GRB
  -D ABL_MILLIAMPS_DEFAULT=1200
  ; ---- LED rail switch (Q3/Q4 via LED_EN), WLED calls it the relay pin ----
  -D RLYPIN=16
  -D RLYMDE=1
  ; ---- touch pad under the white head plate: ESP32 touch channel T0 = GPIO4 ----
  -D BTNPIN=4
  -D BTNTYPE=BTN_TYPE_TOUCH
  -D TOUCH_THRESHOLD=32
  ; ---- battery usermod: 100k/100k divider from BAT+ to GPIO35 ----
  -D USERMOD_BATTERY
  -D USERMOD_BATTERY_MEASUREMENT_PIN=35
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=30000
  -D USERMOD_BATTERY_USE_LIPO
  -D USERMOD_BATTERY_MIN_VOLTAGE=3.0
  -D USERMOD_BATTERY_MAX_VOLTAGE=4.2
  -D USERMOD_BATTERY_VOLTAGE_MULTIPLIER=2.0
  ; ---- keep the strapping pin GPIO12 and the UART pins free ----
  -D WLED_DISABLE_ADALIGHT
lib_deps = ${esp32.lib_deps}
monitor_filters = esp32_exception_decoder
